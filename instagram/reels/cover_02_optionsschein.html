<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Cover Reel 02</title><link href="fonts_bright.css" rel="stylesheet">
<style>
:root{--ink:#0B0E14;--signal:#FFD400;--down:#FF2D55;--up:#00C46A;--grey:#6B7280;--alt:#F2F4F7}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fff}
body{font-family:Inter,sans-serif;color:var(--ink);padding:74px 64px;position:relative}
.top{display:flex;align-items:center;gap:20px}
.mark{width:92px;height:92px;border-radius:50%;background:var(--signal);
      display:flex;align-items:center;justify-content:center;flex:none}
.mark svg{width:70px;height:70px}
.handle{font-weight:800;font-size:34px}
.tag{margin-left:auto;font-weight:800;font-size:28px;letter-spacing:.14em;text-transform:uppercase;
     color:#fff;background:var(--ink);padding:12px 22px;border-radius:9px}
h1{font-family:Anton,sans-serif;text-transform:uppercase;font-size:138px;line-height:.98;
   margin-top:56px;letter-spacing:.004em}
.mk{background:var(--signal);padding:0 16px;margin:0 -8px;display:inline-block;transform:skewX(-6deg)}
.mk>span{display:inline-block;transform:skewX(6deg)}
.rd{color:var(--down)}
.cols{display:flex;gap:22px;margin-top:auto}
.col{flex:1;border:5px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--alt)}
.col .h{font-family:Anton,sans-serif;text-transform:uppercase;font-size:42px;text-align:center;
        padding:16px 0;color:#fff}
.col .h.a{background:var(--down)}.col .h.b{background:var(--up)}
.col ul{list-style:none;padding:22px 24px}
.col li{font-weight:800;font-size:33px;line-height:1.5;display:flex;gap:12px}
.wrap{height:100%;display:flex;flex-direction:column}
.foot{margin-top:26px;font-weight:700;font-size:25px;color:var(--grey)}
.sub{font-weight:800;font-size:44px;color:var(--grey);margin-top:44px;line-height:1.3}
.sub b{color:var(--ink);border-bottom:8px solid var(--signal)}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="mark"><svg viewBox="0 0 1080 1080"><g fill="#0B0E14" transform="translate(0,74)">
      <path d="M420 392 C 330 398 252 356 212 286 C 196 258 190 220 197 189 L 258 212 C 256 243 264 272 281 293 C 314 335 372 353 432 344 Z"/>
      <path d="M660 392 C 750 398 828 356 868 286 C 884 258 890 220 883 189 L 822 212 C 824 243 816 272 799 293 C 766 335 708 353 648 344 Z"/>
      <path d="M402 372 C 402 338 430 316 474 309 C 512 303 568 303 606 309 C 650 316 678 338 678 372 L 674 486 C 669 578 640 660 590 712 C 562 741 518 741 490 712 C 440 660 411 578 406 486 Z"/>
    </g></svg></div>
    <span class="handle">@alphabull.trade</span>
    <span class="tag">Optionen</span>
  </div>
  <h1>Optionsschein<br>ist keine<br><span class="mk"><span>Option</span></span>.</h1>
  <div class="sub">Und der Unterschied<br>kostet dich <b>bares Geld</b>.</div>
  <div class="cols">
    <div class="col"><div class="h a">Optionsschein</div>
      <ul><li><span class="rd">✕</span> Bank stellt den Preis</li>
          <li><span class="rd">✕</span> Emittentenrisiko</li>
          <li><span class="rd">✕</span> keine Prämie</li></ul></div>
    <div class="col"><div class="h b">Option</div>
      <ul><li>✓ Markt stellt den Preis</li>
          <li>✓ Clearing dahinter</li>
          <li>✓ Prämie kassierbar</li></ul></div>
  </div>
  <div class="foot">Keine Anlageberatung.</div>
</div>
</body></html>
