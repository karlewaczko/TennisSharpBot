<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Reel 01 – Gamma-Wall</title>
<link href="fonts.css" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--surface:#151A23;--border:#232B38;--accent:#00E5A0;--danger:#FF4D6D;
      --signal:#FFC845;--text:#E6EBF2;--muted:#8A96A8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,sans-serif;color:var(--text);position:relative}
#bgfx{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 118px,#141A24 118px 120px),
             repeating-linear-gradient(90deg,transparent 0 118px,#141A24 118px 120px),
             radial-gradient(120% 70% at 50% 22%,#111720 0%,#0B0E14 70%)}
#vig{position:absolute;left:0;right:0;bottom:0;height:520px;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,14,20,0) 0%,rgba(11,14,20,.85) 45%,#080B10 100%)}

/* Kopf */
#head{position:absolute;top:250px;left:70px;right:70px;display:flex;align-items:center;gap:20px}
#kicker{font-family:'JetBrains Mono',monospace;font-size:30px;letter-spacing:.2em;
        text-transform:uppercase;color:var(--accent)}
#handle{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--muted)}
.mark{width:46px;height:46px;background:var(--accent);border-radius:6px;position:relative}
.mark::before,.mark::after{content:"";position:absolute;background:var(--bg)}
.mark::before{left:11px;bottom:10px;width:7px;height:13px}
.mark::after{left:22px;bottom:10px;width:7px;height:26px}

/* Headline */
#hl{position:absolute;top:398px;left:70px;right:70px;height:300px}
.line{font-family:'Archivo Black',sans-serif;font-size:88px;white-space:nowrap;line-height:1.06;letter-spacing:-.02em;
      position:absolute;left:0;right:0;will-change:transform,opacity}
.line.l2{top:100px}
.hi{color:var(--accent)}
.hi-r{color:var(--danger)}

/* Chart */
#chartwrap{position:absolute;top:736px;left:60px;width:960px;height:500px}
#chart{position:absolute;inset:0}
#lvlLabel{position:absolute;left:0;font-family:'JetBrains Mono',monospace;font-weight:700;
          font-size:34px;color:var(--danger);background:var(--bg);padding:2px 10px;transform:translateY(-50%)}

/* Karten */
#cards{position:absolute;top:1252px;left:60px;width:960px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:2px solid var(--border);border-left:9px solid var(--accent);
      padding:17px 28px;display:flex;align-items:center;gap:24px;will-change:transform,opacity}
.card .ar{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:var(--accent);min-width:56px}
.card .tx{font-size:34px;font-weight:600;line-height:1.25}
.card.dn{border-left-color:var(--danger)} .card.dn .ar{color:var(--danger)}

/* CTA */
#cta{position:absolute;top:1262px;left:60px;width:960px;text-align:center;opacity:0}
#ctaBig{font-family:'Archivo Black',sans-serif;font-size:58px;color:var(--accent)}
#ctaSub{font-size:32px;color:var(--muted);margin-top:18px}

/* Fuß: Fortschritt + Disclaimer (über der 1520px-Safe-Area) */
#prog{position:absolute;top:1444px;left:60px;width:960px;height:8px;background:var(--border);border-radius:4px}
#progFill{height:100%;width:0;background:var(--accent);border-radius:4px}
#disc{position:absolute;top:1474px;left:60px;width:960px;font-size:22px;color:var(--muted);text-align:center}
</style></head>
<body>

<div id="bgfx"></div><div id="vig"></div>
<div id="head"><div class="mark"></div><span id="kicker">Gamma</span><span id="handle">@optionsflow.de</span></div>

<div id="hl">
  <div class="line l1" id="l1"></div>
  <div class="line l2" id="l2"></div>
</div>

<div id="chartwrap">
  <svg id="chart" viewBox="0 0 960 500" preserveAspectRatio="none">
    <g id="grid"></g>
    <rect id="band" x="0" y="0" width="960" height="0" fill="#FF4D6D" opacity="0"/>
    <g id="oi"></g>
    <line id="lvl" x1="0" y1="0" x2="960" y2="0" stroke="#FF4D6D" stroke-width="4"
          stroke-dasharray="14 10" opacity="0"/>
    <path id="price" fill="none" stroke="#00E5A0" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="dot" r="13" fill="#00E5A0" opacity="0"/>
  </svg>
  <div id="lvlLabel">6.000</div>
</div>

<div id="cards">
  <div class="card"    id="c1"><span class="ar">▲</span><span class="tx">Kurs steigt → sie <b>verkaufen</b></span></div>
  <div class="card dn" id="c2"><span class="ar">▼</span><span class="tx">Kurs fällt → sie <b>kaufen</b></span></div>
</div>

<div id="cta"><div id="ctaBig">Speichern</div><div id="ctaSub">Beim nächsten Verfallstag brauchst du das.</div></div>

<div id="prog"><div id="progFill"></div></div>
<div id="disc">Keine Anlageberatung. Optionen können zum Totalverlust führen.</div>

<script>
const DUR = 32, W = 960, H = 500;
const LVL = 6000, PMIN = 5880, PMAX = 6120;
const y = p => H - (p - PMIN) / (PMAX - PMIN) * H;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const ease = t => t<0?0 : t>1?1 : 1-Math.pow(1-t,3);
// Fenster mit weichem Ein-/Ausblenden
const win = (t,a,b,fi=.35,fo=.35) => clamp(Math.min((t-a)/fi,(b-t)/fo),0,1);

// --- deterministischer Kursverlauf: erst weite Schwankung, dann Verdichtung am Level ---
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20260823);
const N = 240, pts = [];
for(let i=0;i<N;i++){
  const f = i/(N-1);
  const amp = 78 * Math.pow(1-f, 1.6) + 6;          // Amplitude läuft aus → Pinning
  const osc = Math.sin(f*Math.PI*5.4) * amp;
  const noise = (rnd()-.5) * (16 * (1-f) + 4);
  pts.push([f*W, y(LVL + osc + noise)]);
}
const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
const price = document.getElementById('price');
price.setAttribute('d', d);
const LEN = price.getTotalLength();
price.style.strokeDasharray = LEN;

// Gitter
const grid = document.getElementById('grid');
for(let i=1;i<5;i++) grid.insertAdjacentHTML('beforeend',
  `<line x1="0" y1="${i*H/5}" x2="${W}" y2="${i*H/5}" stroke="#232B38" stroke-width="2"/>`);

// Open-Interest-Balken am Level
const oi = document.getElementById('oi');
const bars = [[-60,.30],[-40,.46],[-20,.62],[0,1],[20,.58],[40,.40],[60,.26]];
bars.forEach(([off,h],i)=>oi.insertAdjacentHTML('beforeend',
  `<rect class="oib" data-i="${i}" x="${W-120}" y="${y(LVL+off)-9}" width="0" height="18" fill="#FFC845" opacity=".85"/>`));
const oibs=[...document.querySelectorAll('.oib')];

const lvl=document.getElementById('lvl'), band=document.getElementById('band'),
      dot=document.getElementById('dot'), lab=document.getElementById('lvlLabel'),
      l1=document.getElementById('l1'), l2=document.getElementById('l2'),
      c1=document.getElementById('c1'), c2=document.getElementById('c2'),
      cta=document.getElementById('cta'), progFill=document.getElementById('progFill'),
      kicker=document.getElementById('kicker');
lvl.setAttribute('y1',y(LVL)); lvl.setAttribute('y2',y(LVL));
lab.style.top = y(LVL)+'px';

// --- Beats: [start, ende, Zeile1, Zeile2, Kicker] ---
const BEATS = [
  [0.0,  3.6, 'Der S&P dreht',        'ständig <span class="hi-r">genau hier</span>.',       'Gamma'],
  [3.6,  6.6, 'Kein Zufall.',         'Kein <span class="hi">Widerstand</span>.',             'Gamma'],
  [6.6, 11.8, 'An diesem Strike',     'liegen <span class="hi-r">Millionen</span>.',           'Open Interest'],
  [11.8,17.4, 'Market Maker',         'halten <span class="hi">dagegen</span>.',               'Hedging'],
  [17.4,22.2, 'Nicht aus Meinung.',   'Sondern um <span class="hi">neutral</span> zu bleiben.','Hedging'],
  [22.2,26.6, 'Das Ergebnis:',        'Der Kurs <span class="hi">klebt</span>.',               'Pinning'],
  [26.6,30.0, 'Diese Zahl steht',     '<span class="hi">jeden Morgen</span> fest.',            'Pinning'],
  [30.0,32.0, 'Dein Broker zeigt',    'sie dir nur <span class="hi-r">nicht</span>.',          'Optionsflow']
];

function fit(el){
  const max = el.parentElement.clientWidth;
  let px = 88; el.style.fontSize = px+'px';
  while(el.scrollWidth > max && px > 46){ px -= 2; el.style.fontSize = px+'px'; }
}
function seek(t){
  t = clamp(t, 0, DUR);
  progFill.style.width = (t/DUR*100)+'%';

  // Headline
  const b = BEATS.find(x=>t>=x[0]&&t<x[1]) || BEATS[BEATS.length-1];
  if(l1.dataset.b !== b[0]+''){
    l1.dataset.b=b[0]+''; l1.innerHTML=b[2]; l2.innerHTML=b[3]; kicker.textContent=b[4];
    fit(l1); fit(l2);
  }
  const local = t - b[0], inA = ease(local/.42);
  [l1,l2].forEach((el,i)=>{
    const del = i*.09, a = ease((local-del)/.42), out = clamp((b[1]-t)/.3,0,1);
    el.style.opacity = a*out;
    el.style.transform = `translateY(${(1-a)*46}px)`;
  });

  // Level-Linie
  lvl.setAttribute('opacity', win(t,.5,DUR,.5,.001));
  lab.style.opacity = win(t,.7,DUR,.5,.001);

  // Kurslinie zeichnet sich von 0.3s bis 5.5s auf
  const rev = ease(clamp((t-.3)/5.2,0,1));
  price.style.strokeDashoffset = LEN*(1-rev);
  const idx = clamp(Math.round(rev*(N-1)),0,N-1);
  dot.setAttribute('cx',pts[idx][0]); dot.setAttribute('cy',pts[idx][1]);
  dot.setAttribute('opacity', rev>0 && rev<1 ? 1 : 0);

  // Open Interest 6.6–12.5s
  oibs.forEach((r,i)=>{
    const a = ease(clamp((t-6.8-i*.07)/.5,0,1)) * clamp((13.2-t)/.6,0,1);
    r.setAttribute('width', 108*bars[i][1]*a);
    r.setAttribute('x', W-120);
  });

  // Karten 12.4–22.0s
  [c1,c2].forEach((el,i)=>{
    const a = ease(clamp((t-12.4-i*.5)/.45,0,1)) * clamp((22.2-t)/.4,0,1);
    el.style.opacity=a; el.style.transform=`translateX(${(1-a)*-40}px)`;
  });

  // Pinning-Band 22.2–27s: kollabiert auf das Level
  const pw = win(t,22.2,27.4,.4,.5);
  const half = 96*(1-ease(clamp((t-22.4)/2.6,0,1)))+10;
  band.setAttribute('opacity', pw*.20);
  band.setAttribute('y', y(LVL)-half); band.setAttribute('height', half*2);

  // CTA ab 29.4s
  const ca = ease(clamp((t-29.4)/.5,0,1));
  cta.style.opacity = ca; cta.style.transform=`scale(${.94+.06*ca})`;
  if(ca>0){c1.style.opacity=0;c2.style.opacity=0;}
}
window.DUR = DUR; window.seek = seek;
window.READY = document.fonts.ready.then(()=>{seek(0);return true});
seek(0);
</script>
</body></html>
