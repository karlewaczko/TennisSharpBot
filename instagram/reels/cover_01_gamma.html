<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Cover Reel 01</title><link href="fonts.css" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--accent:#00E5A0;--danger:#FF4D6D;--muted:#8A96A8;--border:#232B38;--text:#E6EBF2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,sans-serif;color:var(--text);position:relative;padding:80px 70px}
#bgfx{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent 0 118px,#141A24 118px 120px),
  repeating-linear-gradient(90deg,transparent 0 118px,#141A24 118px 120px),
  radial-gradient(120% 70% at 50% 25%,#111720 0%,#0B0E14 72%)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column}
.kick{font-family:'JetBrains Mono',monospace;font-size:30px;letter-spacing:.2em;
      text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:18px}
.mark{width:44px;height:44px;background:var(--accent);border-radius:6px;position:relative}
.mark::before,.mark::after{content:"";position:absolute;background:var(--bg)}
.mark::before{left:10px;bottom:9px;width:7px;height:13px}
.mark::after{left:21px;bottom:9px;width:7px;height:25px}
h1{font-family:'Archivo Black',sans-serif;font-size:108px;line-height:1.02;
   letter-spacing:-.025em;margin-top:56px}
.hi{color:var(--danger)}
svg{margin-top:auto;width:940px;height:330px}
.foot{display:flex;align-items:center;margin-top:46px;padding-top:30px;border-top:2px solid var(--border)}
.handle{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--muted)}
.tag{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--accent);
     border:2px solid var(--accent);padding:8px 20px;border-radius:6px}
</style></head><body>
<div id="bgfx"></div>
<div class="wrap">
  <div class="kick"><div class="mark"></div>Gamma</div>
  <h1>Warum der S&amp;P<br>ständig <span class="hi">genau<br>hier</span> dreht.</h1>
  <svg id="c" viewBox="0 0 940 330" preserveAspectRatio="none"></svg>
  <div class="foot"><span class="handle">@optionsflow.de</span><span class="tag">0:32</span></div>
</div>
<script>
const W=940,H=330,LVL=6000,PMIN=5900,PMAX=6100,N=200;
const y=p=>H-(p-PMIN)/(PMAX-PMIN)*H;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r=mul(20260823),pts=[];
for(let i=0;i<N;i++){const f=i/(N-1);
 const amp=62*Math.pow(1-f,1.6)+5, osc=Math.sin(f*Math.PI*5.4)*amp, nz=(r()-.5)*(12*(1-f)+3);
 pts.push([f*W,y(LVL+osc+nz)])}
const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
document.getElementById('c').innerHTML=
 `<line x1="0" y1="${y(LVL)}" x2="${W}" y2="${y(LVL)}" stroke="#FF4D6D" stroke-width="4" stroke-dasharray="14 10"/>
  <path d="${d}" fill="none" stroke="#00E5A0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`;
</script></body></html>
