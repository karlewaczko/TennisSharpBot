name: Update tennis data & model

on:
  schedule:
    # 05:00 UTC daily -- after most matches worldwide have finished and
    # tennis-data.co.uk has published the day's results/odds.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh match/odds history, retrain Elo + model
        run: python scripts/update_data.py

      - name: Refresh walk-forward backtest report
        run: python scripts/run_backtest.py --min-train-seasons 5

      - name: Commit updated data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/reports models
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data update ($(date -u +%Y-%m-%d))"
            git push
          fi
