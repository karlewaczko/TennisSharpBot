name: Weekly Polymarket rankings (Wednesday) - football and basketball

# The tennis ranking runs in the Tuesday job. Football (all leagues) and
# basketball take about 75 minutes together, so they get their own run a day
# later, before the first dashboard run of the morning; on a public
# repository the minutes cost nothing. Rebuilds docs/profis.html, the live
# page of what the ranked wallets bet.
on:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with the other data jobs: one at a time, so no two runs race each
# other's push.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The branch, not the triggering commit: a run that waited in the
      # concurrency queue must start from what the previous run pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Football wallets
        timeout-minutes: 110
        run: python scripts/update_pm_traders.py --sport soccer --days 30

      - name: Basketball wallets
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: python scripts/update_pm_traders.py --sport basketball --days 30

      - name: Live page of the ranked Polymarket wallets
        if: ${{ !cancelled() }}
        run: python scripts/build_pros_live.py

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/reports docs
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi
          git commit -m "Weekly Polymarket rankings ($(date -u +%Y-%m-%d)): football and basketball"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
