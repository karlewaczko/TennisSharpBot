name: Daily Polymarket rankings - tennis, football and basketball

# Ranks the wallets of all three sports by closing-line value over the last
# 30 days and rebuilds docs/profis.html, the live page of what the ranked
# wallets bet, with each account's CLV per sport. About two and a half
# hours (every market is read twice, all fills and the taker fills); on a
# public repository the minutes cost nothing. 04:23 UTC: after the 03:17
# dashboard run and done before the 09:17 one; on Tuesdays the 06:41 job
# waits for it in the shared concurrency group.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with the other data jobs: one at a time, so no two runs race each
# other's push.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The branch, not the triggering commit: a run that waited in the
      # concurrency queue must start from what the previous run pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tennis wallets and prediction-market sharpness
        timeout-minutes: 90
        run: python scripts/update_pm_traders.py --days 30

      - name: Football wallets
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: python scripts/update_pm_traders.py --sport soccer --days 30

      - name: Basketball wallets
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: python scripts/update_pm_traders.py --sport basketball --days 30

      - name: Live page of the ranked Polymarket wallets
        if: ${{ !cancelled() }}
        run: python scripts/build_pros_live.py

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/reports docs
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi
          git commit -m "Daily Polymarket rankings ($(date -u +%Y-%m-%d)): tennis, football, basketball"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
