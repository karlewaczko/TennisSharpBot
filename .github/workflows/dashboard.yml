name: Rebuild value dashboard

# The light job: no retraining. It refreshes the three TennisExplorer
# schedule pages, reads Polymarket and Kalshi, rebuilds the price board and
# the model table from the committed model files, appends the run's quotes
# to the snapshot log and republishes docs/index.html. Four times a day
# catches the morning openers and the evening closers of every time zone.
#
# GitHub runs scheduled workflows from the default branch only, and pauses
# them after 60 days without a commit; the daily update-data job keeps the
# repository active.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn joblib requests lxml python-dateutil tabulate

      - name: Rebuild the card (schedule, books, Polymarket, Kalshi)
        run: |
          python scripts/build_dashboard.py --refresh-schedule --limit 120 --itf-limit 40
          python scripts/render_dashboard.py -o docs/index.html

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/processed/dashboard.json data/processed/tennisexplorer_upcoming.csv \
                  data/processed/odds_snapshots.csv data/processed/picks_log.csv data/reports/dashboard.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Dashboard rebuild ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
