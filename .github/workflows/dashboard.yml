name: Rebuild value dashboard

# The light job: no retraining. It refreshes the three TennisExplorer
# schedule pages, reads Polymarket, Kalshi and Tennis Abstract's tournament
# forecasts, rebuilds the price board and the model table from the
# committed model files, appends the run's quotes and forecasts to the
# logs and republishes docs/index.html. Four times a day catches the
# morning openers and the evening closers of every time zone.
#
# GitHub runs scheduled workflows from the default branch only.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with update-data.yml: one data job at a time.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The branch, not the triggering commit: a run that waited in the
      # concurrency queue must start from what the previous run pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn joblib requests lxml python-dateutil tabulate

      - name: Rebuild the card (schedule, books, Polymarket, Kalshi, Tennis Abstract)
        run: |
          python scripts/build_dashboard.py --refresh-schedule --limit 120 --itf-limit 40
          python scripts/render_dashboard.py -o docs/index.html
          cp docs/index.html data/reports/dashboard.html

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/reports/dashboard.html data/processed/dashboard.json \
                  data/processed/tennisexplorer_upcoming.csv data/processed/odds_snapshots.csv \
                  data/processed/picks_log.csv data/processed/forecasts_log.csv
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Dashboard rebuild ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Logs merge by union (.gitattributes); for the regenerated pages
          # and tables this run's newer build wins a conflict.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
