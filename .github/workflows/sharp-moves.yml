name: Sharp-move alerts - NBA (Polymarket, Kalshi)

# Around the clock, scripts/sharp_move_alert.py watches Polymarket's and
# Kalshi's NBA moneylines every 20 seconds and posts a side rising 3+ points
# within half an hour before the start to Telegram and/or Discord, with the
# lowest bet365 price still worth taking (data/reports/profi_wetten_und_edge.md, 4j).
#
# A GitHub job runs six hours at most, so each run watches for 350 minutes
# and then starts the next one itself (workflow_dispatch with the run's own
# token, which GitHub allows). The schedule every six hours restarts the
# chain should a run ever fail to. GitHub's terms meant Actions for
# building and testing software; a watcher that never stops is a grey zone,
# and the same script runs on any PC (see ANLEITUNG.md).
#
# Channels come from repository secrets (Settings -> Secrets and variables
# -> Actions): TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID, and/or
# DISCORD_WEBHOOK_URL. Without them the run only logs. Run it by hand with
# "test" ticked to send one test message.
#
# Its own concurrency group: the data workflows must not wait six hours
# behind it. Only the alert log is committed.

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to watch"
        default: "350"
      test:
        description: "Only send a test message"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sharp-moves
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Watch NBA moneylines
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python scripts/sharp_move_alert.py --test
          else
            python scripts/sharp_move_alert.py --minutes "${{ github.event.inputs.minutes || '350' }}"
          fi

      - name: Commit the alert log
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/processed/sharp_move_alerts.csv ] || exit 0
          git add data/processed/sharp_move_alerts.csv
          if git diff --cached --quiet; then
            echo "No new alerts."
            exit 0
          fi
          git commit -m "Sharp-move alerts ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1

      # The chain: each run starts the next before it ends; a pending run
      # waits in the concurrency group until this one has finished.
      - name: Start the next watch
        if: ${{ !cancelled() && github.event.inputs.test != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sharp-moves.yml --ref "${GITHUB_REF_NAME}" -f minutes=350 -f test=false
